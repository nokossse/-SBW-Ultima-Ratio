modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
credits = "Per-vehicle credits are shown on each vehicle crate. Built on Superb Warfare by Atsuishio, Roki27, Light_Quanta and contributors."
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "superbwarfare"
type = "required"
versionRange = "[0.8.9,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "simplebedrockmodel"
type = "required"
versionRange = "[2.5.1.1,)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "ultimaratio.mixins.json"
