plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.91'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    flatDir { dir 'libs' }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run-1.21.1')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -PquickPlay="New World" loads straight into that save
            if (project.hasProperty('quickPlay')) programArguments.addAll '--quickPlaySingleplayer', project.quickPlay
        }
        server {
            server()
            gameDirectory = project.file('run-1.21.1')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:5.10.0"
    implementation name: 'superbwarfare-0.8.9.2-mc1.21.1'
    implementation name: 'SimpleBedrockModel-2.5.1.1-neoforge-mc1.21.1'
    implementation name: 'geckolib-neoforge-1.21.1-4.7.5'
    implementation name: 'curios-neoforge-9.2.0+1.21.1'
    implementation name: 'mae-1.1.4'
    // Optional at runtime: the code is guarded by ModList.isLoaded("distanthorizons")
    implementation name: 'DistantHorizons-3.3.3-1.21.1-fabric-neoforge'
    // Dev client only: reproduces the Sodium rewrite of LevelRenderer.setupRender (see UltimaRatioMixinPlugin)
    runtimeOnly name: 'sodium-neoforge-0.8.13+mc1.21.1'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                             neo_version: neo_version, neo_version_range: neo_version_range,
                             loader_version_range: loader_version_range,
                             mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors: mod_authors, mod_description: mod_description]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
